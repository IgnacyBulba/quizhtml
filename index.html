<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz HTML i CSS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#101827,#202e4b);color:#f1f5f9}
.card{width:100%;max-width:620px;background:#1e293b;padding:30px;border-radius:22px;box-shadow:0 20px 60px #0005}
h1{text-align:center;margin:0 0 8px;font-size:30px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:28px}
.top{display:flex;justify-content:space-between;gap:10px;color:#cbd5e1;font-size:14px;margin-bottom:12px}
.bar{height:7px;background:#334155;border-radius:10px;overflow:hidden;margin-bottom:26px}
#progress{height:100%;width:0;background:#38bdf8;transition:width .25s}
#question{font-size:21px;line-height:1.45;margin-bottom:22px}
.answers{display:grid;gap:12px}
.answer{display:flex;align-items:center;gap:12px;text-align:left;padding:15px;border:1px solid #475569;background:#263449;color:#f1f5f9;border-radius:12px;font-size:16px;cursor:pointer;transition:.2s}
.answer:hover:not(:disabled){border-color:#38bdf8;background:#334155;transform:translateY(-1px)}
.letter{display:grid;place-items:center;min-width:32px;height:32px;border-radius:9px;background:#334155;font-weight:bold}
.answer.correct{background:#14532d;border-color:#4ade80}
.answer.wrong{background:#7f1d1d;border-color:#f87171}
.answer:disabled{cursor:default}
#next,.restart{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#38bdf8;color:#082f49;font-size:16px;font-weight:bold;cursor:pointer}
#next:disabled{opacity:.4;cursor:not-allowed}
#result{text-align:center}
#score{font-size:48px;font-weight:bold;color:#38bdf8;margin:22px 0 10px}
#grade{font-size:25px;margin:12px}
.hidden{display:none}
@media(max-width:480px){.card{padding:22px 17px}h1{font-size:25px}#question{font-size:19px}.answer{padding:12px;font-size:15px}}
</style>
</head>
<body>
<main class="card">
<h1>Quiz HTML &amp; CSS</h1>
<p class="subtitle">Sprawdź swoją wiedzę i zdobądź ocenę!</p>
<section id="quiz">
<div class="top"><span id="counter">Pytanie 1/10</span><span id="category">HTML</span></div>
<div class="bar"><div id="progress"></div></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<button id="next" disabled>Dalej →</button>
</section>
<section id="result" class="hidden">
<h2>Koniec quizu!</h2><div id="score">0/10</div><div id="grade"></div><p id="message"></p>
<button class="restart" id="restart">Zagraj ponownie ↻</button>
</section>
</main>
<script>
const questions=[
{c:"HTML",q:"Co oznacza HTML?",a:["HyperText Markup Language","HighText Machine Language","HyperTool Modern Language","HomeText Markup Link"],k:0},
{c:"HTML",q:"Który znacznik tworzy nagłówek?",a:["<p>","<h1>","<head>","<title>"],k:1},
{c:"HTML",q:"Który znacznik tworzy akapit?",a:["<text>","<div>","<p>","<br>"],k:2},
{c:"HTML",q:"Jak wstawić obraz?",a:["<image>","<picture src>","<img>","<photo>"],k:2},
{c:"HTML",q:"Który znacznik tworzy link?",a:["<a>","<linkto>","<href>","<url>"],k:0},
{c:"HTML",q:"Jaki atrybut określa adres linku?",a:["src","href","alt","target"],k:1},
{c:"HTML",q:"Który znacznik tworzy listę numerowaną?",a:["<ul>","<li>","<dl>","<ol>"],k:3},
{c:"HTML",q:"Jaki znacznik tworzy komórkę tabeli?",a:["<td>","<tr>","<th>","<table>"],k:0},
{c:"HTML",q:"Który znacznik tworzy formularz?",a:["<input>","<label>","<form>","<button>"],k:2},
{c:"HTML",q:"Gdzie umieszcza się treść strony?",a:["<head>","<body>","<meta>","<title>"],k:1},
{c:"HTML",q:"Który znacznik wstawia podział linii?",a:["<hr>","<p>","<br>","<line>"],k:2},
{c:"HTML",q:"Jak dodać tekst alternatywny obrazu?",a:["title","href","alt","name"],k:2},
{c:"HTML",q:"Który znacznik oznacza ważny tekst?",a:["<strong>","<small>","<marking>","<sub>"],k:0},
{c:"HTML",q:"Który znacznik tworzy wiersz tabeli?",a:["<td>","<tr>","<th>","<row>"],k:1},
{c:"HTML",q:"Jak oznaczyć kodowanie znaków UTF-8?",a:["<charset>","<meta charset=\"UTF-8\">","<encoding>","<html utf8>"],k:1},
{c:"CSS",q:"Do czego służy CSS?",a:["Do stylowania strony","Do baz danych","Do tworzenia serwera","Do pisania tekstu"],k:0},
{c:"CSS",q:"Jak zmienić kolor tekstu?",a:["font-color","text-color","color","foreground"],k:2},
{c:"CSS",q:"Jak wybrać element o id=\"box\"?",a:[".box","box","#box","*box"],k:2},
{c:"CSS",q:"Jak wybrać elementy klasy menu?",a:["#menu",".menu","menu()","@menu"],k:1},
{c:"CSS",q:"Jak ustawić kolor tła?",a:["background-color","color","bg","fill-color"],k:0},
{c:"CSS",q:"Która właściwość zmienia rozmiar tekstu?",a:["text-size","font-size","size","font-style"],k:1},
{c:"CSS",q:"Do czego służy margin?",a:["Do obramowania","Do marginesu zewnętrznego","Do koloru","Do cienia"],k:1},
{c:"CSS",q:"Do czego służy padding?",a:["Do odstępu wewnętrznego","Do odstępu zewnętrznego","Do animacji","Do czcionki"],k:0},
{c:"CSS",q:"Jak zaokrąglić rogi elementu?",a:["corner","border-round","border-radius","radius-size"],k:2},
{c:"CSS",q:"Jak ustawić układ Flexbox?",a:["display:flex","position:flex","layout:flex","flex:on"],k:0}
];
const $=id=>document.getElementById(id);
let round=[],index=0,score=0,answered=false;
function shuffle(arr){
 const copy=[...arr];
 for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}
 return copy;
}
function start(){
 round=shuffle(questions).slice(0,10);index=0;score=0;answered=false;
 $("quiz").classList.remove("hidden");$("result").classList.add("hidden");showQuestion();
}
function showQuestion(){
 answered=false;const item=round[index];
 $("counter").textContent=`Pytanie ${index+1}/10`;$("category").textContent=item.c;
 $("progress").style.width=`${index*10}%`;$("question").textContent=item.q;
 $("answers").replaceChildren();$("next").disabled=true;
 $("next").textContent=index===9?"Zobacz wynik":"Dalej →";
 item.a.forEach((answer,i)=>{
  const button=document.createElement("button");button.className="answer";
  const letter=document.createElement("span");letter.className="letter";letter.textContent="ABCD"[i];
  const text=document.createElement("span");text.textContent=answer;
  button.append(letter,text);button.addEventListener("click",()=>selectAnswer(i));$("answers").append(button);
 });
}
function selectAnswer(choice){
 if(answered)return;answered=true;const item=round[index];if(choice===item.k)score++;
 [...$("answers").children].forEach((button,i)=>{
  button.disabled=true;if(i===item.k)button.classList.add("correct");else if(i===choice)button.classList.add("wrong");
 });
 $("next").disabled=false;
}
function nextQuestion(){if(!answered)return;index++;if(index<10)showQuestion();else showResult()}
function showResult(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 const grade=score<=4?1:score===5?2:score===6?3:score<=8?4:score===9?5:6;
 $("score").textContent=`${score}/10`;$("grade").textContent=`Twoja ocena: ${grade}`;
 $("message").textContent=score===10?"Perfekcyjnie! Wszystkie odpowiedzi poprawne.":score>=7?"Dobra robota! Masz solidną wiedzę.":score>=5?"Nieźle, ale warto jeszcze poćwiczyć.":"Czas powtórzyć podstawy HTML i CSS.";
}
$("next").addEventListener("click",nextQuestion);$("restart").addEventListener("click",start);start();
</script>
</body>
</html>
